name: Deployment

on:
  push:
    branches:
      - main
      - stage
  repository_dispatch:
    types: [deploy-infra]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality-gates:
    name: Quality Gates
    uses: ./.github/workflows/ci.yml

  docker:
    name: Build & Push Image to GHCR
    needs: quality-gates
    if: github.ref_name == 'main' || github.ref_name == 'stage' || github.event_name == 'repository_dispatch' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ github.ref_name }}
            type=sha,prefix=${{ github.ref_name }}-
            type=ref,event=branch

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-oci-production:
    name: Deploy to OCI Compute Instance
    needs: docker
    if: (github.ref_name == 'main' || github.event_name == 'repository_dispatch' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - uses: actions/checkout@v4

      - name: Copy deployment files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USERNAME || 'ubuntu' }}
          key: ${{ secrets.OCI_SSH_KEY }}
          port: ${{ secrets.OCI_PORT || 22 }}
          timeout: 60s
          command_timeout: 10m
          source: "docker-compose.yml,nginx/,init-ssl.sh,.env.example"
          target: "/home/${{ secrets.OCI_USERNAME || 'ubuntu' }}/app"

      - name: Execute deployment commands via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USERNAME || 'ubuntu' }}
          key: ${{ secrets.OCI_SSH_KEY }}
          port: ${{ secrets.OCI_PORT || 22 }}
          timeout: 60s
          command_timeout: 10m
          script: |
            cd /home/${{ secrets.OCI_USERNAME || 'ubuntu' }}/app
            
            # Refresh application environment variables from OCI Vault (or GitHub secret override)
            if [ -n "${{ secrets.ENV_FILE }}" ]; then
              echo "${{ secrets.ENV_FILE }}" > .env
            elif [ -n "${{ secrets.ENV_DOCKER }}" ]; then
              echo "${{ secrets.ENV_DOCKER }}" > .env
            elif [ -f /usr/local/bin/fetch-vault-secrets ]; then
              /usr/local/bin/fetch-vault-secrets
            elif [ ! -f .env ]; then
              cp .env.example .env
            fi
            
            # Login to GHCR to pull private image
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Pull latest image & restart services
            APP_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" docker compose pull
            APP_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" docker compose up -d --remove-orphans
            
            # Prune old dangling images
            docker image prune -f

      - name: Verify Deployment (Smoke Test)
        run: |
          echo "Verifying API health..."
          for i in {1..12}; do
            STATUS=$(curl -s -k -o /dev/null -w "%{http_code}" https://${{ secrets.OCI_HOST }}/healthcheck || curl -s -k -o /dev/null -w "%{http_code}" http://${{ secrets.OCI_HOST }}/healthcheck || echo "failed")
            if [ "$STATUS" = "200" ]; then
              echo "✅ Healthcheck passed!"
              exit 0
            fi
            echo "Waiting for service to be healthy (attempt $i/12)... Status: $STATUS"
            sleep 10
          done
          echo "❌ Healthcheck failed!"
          exit 1

