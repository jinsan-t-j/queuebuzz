services:
  # ──────────────────────────────────────────────
  # Nginx — Reverse Proxy & Local Load Balancer
  # ──────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: queuebuzz-nginx
    restart: unless-stopped
    stop_grace_period: 10s
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certbot/conf:/etc/letsencrypt:ro
      - ./nginx/certbot/www:/var/www/certbot:ro
    networks:
      - frontend
      - backend
    depends_on:
      app:
        condition: service_started
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETUID
      - SETGID
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1/healthcheck || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"
        reservations:
          memory: 32M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ──────────────────────────────────────────────
  # Certbot — Automatic Let's Encrypt SSL
  # ──────────────────────────────────────────────
  certbot:
    image: certbot/certbot
    container_name: queuebuzz-certbot
    restart: unless-stopped
    volumes:
      - ./nginx/certbot/conf:/etc/letsencrypt
      - ./nginx/certbot/www:/var/www/certbot
    networks: []
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.10"
    entrypoint: "/bin/sh -c 'trap exit TERM; while true; do certbot renew; sleep 12h & wait $${!}; done;'"
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # ──────────────────────────────────────────────
  # App — Go Fiber Backend (scalable replicas)
  # ──────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${APP_IMAGE:-ghcr.io/jinsan-t-j/queuebuzz:latest}
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=64M
    env_file:
      - .env
    environment:
      - PORT=8080
      - REDIS_ADDR=valkey:6379
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - backend
    depends_on:
      valkey:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.50"
        reservations:
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ──────────────────────────────────────────────
  # Valkey — Redis-compatible in-memory store
  # ──────────────────────────────────────────────
  valkey:
    image: valkey/valkey:8.0-alpine
    container_name: queuebuzz-valkey
    restart: unless-stopped
    stop_grace_period: 10s
    working_dir: /data
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=16M
    entrypoint: >
      /bin/sh -c '
      exec valkey-server
      --save 60 1
      --loglevel notice
      --requirepass "$$REDIS_PASSWORD"
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
      '
    env_file:
      - .env
    networks:
      - backend
    volumes:
      - valkey-data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - CHOWN
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 192M
          cpus: "0.25"
        reservations:
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ──────────────────────────────────────────────
  # Kibana — Monitoring Dashboard
  # ──────────────────────────────────────────────
  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: queuebuzz-kibana
    restart: unless-stopped
    stop_grace_period: 15s
    env_file:
      - .env
    environment:
      - ELASTICSEARCH_HOSTS=http://localhost:9200
    networks:
      - backend
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.50"
        reservations:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge

volumes:
  valkey-data:
