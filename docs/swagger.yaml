basePath: /api
definitions:
  domain.Plan:
    properties:
      country_code:
        description: e.g., "IN", "US", or "GLOBAL"
        type: string
      created_at:
        type: string
      currency:
        description: e.g., "INR", "USD"
        type: string
      description:
        type: string
      id:
        type: string
      is_free:
        type: boolean
      limits:
        $ref: '#/definitions/domain.PlanLimit'
      monthly_price:
        type: integer
      name:
        type: string
      priority:
        type: integer
      slug:
        type: string
      tier:
        description: e.g., "free", "pro", "elite", "enterprise"
        type: string
      yearly_price:
        type: integer
    type: object
  domain.PlanLimit:
    properties:
      can_export:
        type: boolean
      can_view_guest_data:
        type: boolean
      custom_branding:
        type: boolean
      history_access:
        type: boolean
      history_retention_days:
        type: integer
      max_guests_per_queue:
        type: integer
      max_queues_per_month:
        type: integer
      queue_expiry_hours:
        type: integer
    type: object
  dto.ActiveQueueStats:
    properties:
      isActive:
        type: boolean
      queueName:
        type: string
      startedAt:
        type: string
    type: object
  dto.AddEntryRequest:
    properties:
      email:
        type: string
      name:
        maxLength: 50
        minLength: 3
        type: string
      party_size:
        maximum: 100
        minimum: 1
        type: integer
      phone:
        type: string
    required:
    - name
    type: object
  dto.CancelSubscriptionRequest:
    properties:
      comment:
        type: string
      feedback:
        type: string
    type: object
  dto.ChartDataPoint:
    properties:
      avgWait:
        description: in seconds
        type: integer
      day:
        type: string
      isFuture:
        type: boolean
      isToday:
        type: boolean
      value:
        type: integer
    type: object
  dto.CheckMethodRequest:
    properties:
      claim_queue_id:
        type: string
      email:
        type: string
      redirect_url:
        type: string
    required:
    - email
    type: object
  dto.CheckSlugResponse:
    properties:
      is_available:
        type: boolean
    type: object
  dto.CheckoutRequest:
    properties:
      billing_cycle:
        enum:
        - monthly
        - yearly
        type: string
      plan_id:
        type: string
    required:
    - plan_id
    type: object
  dto.CheckoutResponse:
    properties:
      url:
        type: string
    type: object
  dto.CreateQueueRequest:
    properties:
      allow_party_joining:
        type: boolean
      avg_service_mins:
        maximum: 60
        minimum: 1
        type: integer
      collect_emails:
        type: boolean
      manual_positioning:
        type: boolean
      max_party_size:
        maximum: 100
        minimum: 1
        type: integer
      name:
        maxLength: 50
        minLength: 3
        type: string
      slug:
        maxLength: 30
        minLength: 3
        type: string
    required:
    - name
    type: object
  dto.DashboardData:
    properties:
      activeQueue:
        $ref: '#/definitions/dto.ActiveQueueStats'
      droppedSkipped:
        items:
          $ref: '#/definitions/dto.HeatmapPoint'
        type: array
      greeting:
        $ref: '#/definitions/dto.GreetingData'
      hasHistory:
        type: boolean
      peakHours:
        items:
          $ref: '#/definitions/dto.PeakHourPoint'
        type: array
      quickSetup:
        $ref: '#/definitions/dto.QuickSetupData'
      recentSessions:
        items:
          $ref: '#/definitions/dto.RecentSession'
        type: array
      returnRate:
        $ref: '#/definitions/dto.ReturnRateStats'
      stats:
        $ref: '#/definitions/dto.DashboardStats'
      weekChart:
        items:
          $ref: '#/definitions/dto.ChartDataPoint'
        type: array
    type: object
  dto.DashboardStats:
    properties:
      avgWait:
        type: string
      peakWait:
        type: integer
      servedToday:
        type: integer
      skipped:
        type: integer
    type: object
  dto.EntryRecord:
    properties:
      created_at:
        type: string
      created_by:
        type: string
      email:
        type: string
      finished_at:
        type: string
      id:
        type: string
      name:
        type: string
      party_size:
        type: integer
      phone:
        type: string
      position:
        type: integer
      queue_id:
        type: string
      served_at:
        type: string
      status:
        type: string
      ticket_no:
        type: string
      updated_at:
        type: string
      wait_time_min:
        type: integer
    type: object
  dto.GetMeResponse:
    properties:
      address:
        type: string
      avatar:
        type: string
      banner_image_url:
        type: string
      business_name:
        type: string
      email:
        type: string
      id:
        type: string
      name:
        type: string
      profile_image_url:
        type: string
      public_id:
        type: string
      tier:
        type: string
    type: object
  dto.GreetingData:
    properties:
      name:
        type: string
    type: object
  dto.HeatmapPoint:
    properties:
      day:
        type: integer
      hour:
        type: integer
      value:
        type: integer
    type: object
  dto.PeakHourPoint:
    properties:
      hour:
        type: string
      value:
        type: integer
    type: object
  dto.PlanResponse:
    properties:
      plan:
        $ref: '#/definitions/domain.Plan'
    type: object
  dto.PlansResponse:
    properties:
      plans:
        items:
          $ref: '#/definitions/domain.Plan'
        type: array
    type: object
  dto.QueueRecord:
    properties:
      allow_party_joining:
        type: boolean
      avg_service_mins:
        type: integer
      collect_emails:
        type: boolean
      created_at:
        type: string
      expires_at:
        type: string
      host_banner_image_url:
        type: string
      host_profile_image_url:
        type: string
      id:
        type: string
      join_code:
        type: string
      manual_positioning:
        type: boolean
      max_party_size:
        type: integer
      name:
        type: string
      notes:
        type: string
      slug:
        type: string
      status:
        type: string
      strict_queue_mode:
        type: boolean
      updated_at:
        type: string
    type: object
  dto.QuickSetupData:
    properties:
      show:
        type: boolean
      steps:
        items:
          $ref: '#/definitions/dto.QuickSetupStep'
        type: array
    type: object
  dto.QuickSetupStep:
    properties:
      isDone:
        type: boolean
      label:
        type: string
      sub:
        type: string
    type: object
  dto.RecentSession:
    properties:
      date:
        type: string
      duration:
        type: string
      id:
        type: string
      name:
        type: string
      served:
        type: integer
    type: object
  dto.ReturnRatePoint:
    properties:
      day:
        type: string
      rate:
        type: number
    type: object
  dto.ReturnRateQueue:
    properties:
      label:
        type: string
      rate:
        type: number
    type: object
  dto.ReturnRateStats:
    properties:
      byQueue:
        items:
          $ref: '#/definitions/dto.ReturnRateQueue'
        type: array
      chartData:
        items:
          $ref: '#/definitions/dto.ReturnRatePoint'
        type: array
      hasData:
        type: boolean
      returningCount:
        type: integer
    type: object
  dto.SubscriptionResponse:
    properties:
      billing_cycle:
        type: string
      can_custom_branding:
        type: boolean
      can_export_data:
        type: boolean
      can_view_history:
        type: boolean
      cancel_at_period_end:
        type: boolean
      card_last_4:
        type: string
      current_period_end:
        type: string
      plan_name:
        type: string
      status:
        type: string
      tier:
        type: string
      updated_at:
        type: string
    type: object
  dto.UpdateEntryRequest:
    properties:
      email:
        type: string
      fcm_token:
        type: string
      name:
        minLength: 2
        type: string
      party_size:
        maximum: 100
        minimum: 1
        type: integer
    type: object
  dto.UpdateMeRequest:
    properties:
      email:
        type: string
      name:
        type: string
      settings:
        additionalProperties: true
        type: object
    type: object
  dto.UpdatePaymentMethodRequest:
    properties:
      return_url:
        type: string
    type: object
  dto.UpdateQueueRequest:
    properties:
      allow_party_joining:
        type: boolean
      avg_service_mins:
        maximum: 60
        minimum: 1
        type: integer
      collect_emails:
        type: boolean
      max_party_size:
        maximum: 100
        minimum: 1
        type: integer
      name:
        maxLength: 50
        minLength: 3
        type: string
      notes:
        maxLength: 5000
        type: string
      slug:
        maxLength: 30
        minLength: 3
        type: string
      strict_queue_mode:
        type: boolean
    type: object
  dto.WebhookRequest:
    properties:
      data: {}
      type:
        type: string
    required:
    - data
    - type
    type: object
  helpers.ErrorResponse:
    properties:
      error: {}
      message:
        type: string
    type: object
  helpers.SuccessResponse:
    properties:
      data: {}
      message:
        type: string
    type: object
  sse.Message:
    properties:
      data: {}
      event:
        type: string
    type: object
host: localhost:8080
info:
  contact:
    email: support@queuebuzz.com
    name: QueueBuzz Support
  description: Virtual queue management platform API.
  license:
    name: Proprietary
  termsOfService: https://queuebuzz.com/terms
  title: QueueBuzz API
  version: "1.0"
paths:
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: Handles authentication entry point. If the email is social-linked,
        redirects to provider. If not, sends a magic link.
      parameters:
      - description: Authentication request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CheckMethodRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Magic link sent
          schema:
            $ref: '#/definitions/helpers.SuccessResponse'
        "302":
          description: Redirect to social provider
          schema:
            type: string
        "400":
          description: Invalid request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Login or Register via email
      tags:
      - Auth
  /api/v1/auth/logout:
    post:
      description: Clears host auth cookies and revokes the refresh token if present
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/helpers.SuccessResponse'
      summary: Logout host
      tags:
      - Auth
  /api/v1/auth/refresh:
    post:
      description: Uses the refresh token cookie to issue a new access token and refresh
        token
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/helpers.SuccessResponse'
        "401":
          description: Error response
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Refresh access token
      tags:
      - Auth
  /api/v1/billing/checkout:
    post:
      consumes:
      - application/json
      description: Authenticated hosts can create a checkout session for a paid plan.
      parameters:
      - description: Plan selection
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CheckoutRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Contains 'url' field with redirect URL
          schema:
            allOf:
            - $ref: '#/definitions/helpers.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.CheckoutResponse'
              type: object
        "400":
          description: Invalid plan, free plan, enterprise, missing product config
          schema:
            $ref: '#/definitions/helpers.ErrorResponse'
        "401":
          description: Host not authenticated
          schema:
            $ref: '#/definitions/helpers.ErrorResponse'
        "429":
          description: Duplicate checkout request within 30s window
          schema:
            $ref: '#/definitions/helpers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create checkout session
      tags:
      - Billing
  /api/v1/billing/current-plan:
    get:
      description: Returns the active billing plan with feature limits, current usage
        counters,
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/helpers.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.PlanResponse'
              type: object
      security:
      - BearerAuth: []
      summary: Get current plan
      tags:
      - Billing
  /api/v1/billing/plans:
    get:
      description: Returns all available plans (Free, Pro, Elite) localized to the
        visitor's
      parameters:
      - description: ISO 3166-1 alpha-2 country code (e.g. IN, US)
        in: query
        name: country
        type: string
      - description: IANA timezone (e.g. Asia/Kolkata) for auto country detection
        in: header
        name: X-Browser-Timezone
        type: string
      - description: Cloudflare edge-resolved country code
        in: header
        name: CF-IPCountry
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Localized plan list
          schema:
            allOf:
            - $ref: '#/definitions/helpers.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.PlansResponse'
              type: object
        "500":
          description: Database or aggregation error
          schema:
            $ref: '#/definitions/helpers.ErrorResponse'
      summary: List billing plans
      tags:
      - Billing
  /api/v1/billing/subscription:
    get:
      description: Returns the host's active subscription details including cancellation
        status.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/helpers.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.SubscriptionResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/helpers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/helpers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get subscription
      tags:
      - Billing
  /api/v1/billing/subscription/cancel:
    post:
      consumes:
      - application/json
      description: Schedules the host's subscription for cancellation at the end of
        the current billing period.
      parameters:
      - description: Cancellation details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CancelSubscriptionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/helpers.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/helpers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/helpers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Cancel subscription
      tags:
      - Billing
  /api/v1/billing/subscription/update-payment-method:
    post:
      consumes:
      - application/json
      description: Returns a secure payment link where the host can update their payment
        method.
      parameters:
      - description: Return URL
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UpdatePaymentMethodRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/helpers.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/helpers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/helpers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update payment method
      tags:
      - Billing
  /api/v1/billing/webhook:
    post:
      consumes:
      - application/json
      description: Endpoint for Dodo Payments to send subscription and payment events.
      parameters:
      - description: Webhook ID
        in: header
        name: webhook-id
        required: true
        type: string
      - description: Webhook Signature
        in: header
        name: webhook-signature
        required: true
        type: string
      - description: Webhook Timestamp
        in: header
        name: webhook-timestamp
        required: true
        type: string
      - description: Webhook payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.WebhookRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
      summary: Billing Webhook
      tags:
      - Billing
  /auth/social/{provider}/callback:
    get:
      description: Handles OAuth provider callbacks, creates or links a host account,
        sets auth cookies, and redirects to the dashboard.
      parameters:
      - description: Social provider
        in: path
        name: provider
        required: true
        type: string
      - description: OAuth code
        in: query
        name: code
        type: string
      - description: OAuth state
        in: query
        name: state
        type: string
      produces:
      - text/html
      responses:
        "302":
          description: Redirect to dashboard
          schema:
            type: string
        "400":
          description: Error response
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Error response
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Error response
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Complete social sign in
      tags:
      - Auth
  /auth/social/{provider}/start:
    get:
      description: Starts the provider OAuth authorization code flow and redirects
        the browser to the selected provider.
      parameters:
      - description: Social provider
        in: path
        name: provider
        required: true
        type: string
      produces:
      - text/html
      responses:
        "302":
          description: Redirect to provider
          schema:
            type: string
        "400":
          description: Error response
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Error response
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Start social sign in
      tags:
      - Auth
  /auth/verify:
    get:
      description: Verifies a magic link or OTP, creates or links a host account,
        sets auth cookies, and redirects to the dashboard.
      parameters:
      - description: Magic link token
        in: query
        name: token
        type: string
      - description: Phone number
        in: query
        name: phone
        type: string
      - description: OTP code
        in: query
        name: otp
        type: string
      produces:
      - text/html
      responses:
        "302":
          description: Redirect to dashboard
          schema:
            type: string
        "400":
          description: Error response
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Error response
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Error response
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Verify magic link or OTP
      tags:
      - Auth
  /entry/{id}:
    get:
      description: Gets an entry by ID for the authenticated host.
      produces:
      - application/json
      responses:
        "200":
          description: Entry added
          schema:
            $ref: '#/definitions/dto.EntryRecord'
        "400":
          description: Error response
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Error response
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Error response
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get entry by ID
      tags:
      - Entry
  /entry/{id}/stream:
    get:
      description: Streams events for an entry.
      produces:
      - application/json
      responses:
        "200":
          description: Entry added
          schema:
            $ref: '#/definitions/dto.EntryRecord'
        "400":
          description: Error response
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Error response
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Error response
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Stream events for an entry
      tags:
      - Entry
  /entry/confirm:
    post:
      description: Transition from IDLE back to WAITING status when customer confirms
        presence.
      produces:
      - application/json
      responses:
        "200":
          description: Success
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Error response
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Error response
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Confirm still here (Recovery)
      tags:
      - Entry
  /entry/confirm-arrived:
    post:
      description: Confirms arrival for the currently authenticated entry.
      produces:
      - application/json
      responses:
        "200":
          description: Successfully confirmed arrival
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Error response
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Error response
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Error response
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Confirm arrived
      tags:
      - Entry
  /entry/finish:
    post:
      description: Marks the currently authenticated entry as served and clears the
        session.
      produces:
      - application/json
      responses:
        "200":
          description: Successfully finished service
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Error response
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Error response
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Finish service (Guest self-serve)
      tags:
      - Entry
  /entry/join/{id}:
    post:
      description: Joins the queue using a queue ID.
      produces:
      - application/json
      responses:
        "200":
          description: Successfully joined the queue
          schema:
            $ref: '#/definitions/dto.EntryRecord'
        "400":
          description: Error response
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Error response
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Error response
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Join queue by ID
      tags:
      - Entry
  /entry/recover-by-token:
    get:
      description: Recovers a guest session using an email recovery token.
      produces:
      - application/json
      responses:
        "200":
          description: Session recovered
          schema:
            $ref: '#/definitions/dto.EntryRecord'
        "400":
          description: Error response
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "410":
