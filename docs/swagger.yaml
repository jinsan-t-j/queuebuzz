basePath: /api
definitions:
  dto.AddEntryRequest:
    properties:
      email:
        type: string
      name:
        maxLength: 50
        minLength: 3
        type: string
      party_size:
        maximum: 100
        minimum: 1
        type: integer
      phone:
        type: string
    required:
    - name
    type: object
  dto.CheckSlugResponse:
    properties:
      is_available:
        type: boolean
    type: object
  dto.CreateQueueRequest:
    properties:
      allow_party_joining:
        type: boolean
      avg_service_mins:
        maximum: 60
        minimum: 1
        type: integer
      max_party_size:
        maximum: 100
        minimum: 1
        type: integer
      name:
        maxLength: 50
        minLength: 3
        type: string
      recovery_email:
        type: string
      slug:
        maxLength: 20
        minLength: 3
        type: string
    required:
    - name
    type: object
  dto.CreateQueueResponse:
    properties:
      allow_party_joining:
        type: boolean
      avg_service_mins:
        type: integer
      created_at:
        type: string
      expires_at:
        type: string
      id:
        type: string
      join_code:
        type: string
      max_party_size:
        type: integer
      name:
        type: string
      slug:
        type: string
      status:
        type: string
    type: object
  dto.GetLiveQueueResponse:
    properties:
      allow_party_joining:
        type: boolean
      avg_service_mins:
        type: integer
      created_at:
        type: string
      expires_at:
        type: string
      id:
        type: string
      join_code:
        type: string
      max_party_size:
        type: integer
      name:
        type: string
      slug:
        type: string
      status:
        type: string
    type: object
  dto.GetMeResponse:
    properties:
      avatar:
        type: string
      email:
        type: string
      id:
        type: string
      name:
        type: string
      public_id:
        type: string
      tier:
        type: string
    type: object
  helpers.SuccessResponse:
    properties:
      data: {}
      message:
        type: string
    type: object
  queuebuzz_internal_modules_auth_dto.RegisterRequest:
    properties:
      email:
        type: string
      phone:
        type: string
    type: object
host: localhost:8080
info:
  contact:
    email: support@queuebuzz.com
    name: QueueBuzz Support
  description: Virtual queue management platform API.
  license:
    name: Proprietary
  termsOfService: https://queuebuzz.com/terms
  title: QueueBuzz API
  version: "1.0"
paths:
  /api/v1/auth/logout:
    post:
      description: Clears host auth cookies and revokes the refresh token if present
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/helpers.SuccessResponse'
      summary: Logout host
      tags:
      - Auth
  /api/v1/auth/refresh:
    post:
      description: Uses the refresh token cookie to issue a new access token and refresh
        token
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/helpers.SuccessResponse'
        "401":
          description: Error response
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Refresh access token
      tags:
      - Auth
  /api/v1/auth/register:
    post:
      consumes:
      - application/json
      description: Triggers Magic Link (email) or OTP (phone) for host registration
      parameters:
      - description: Register host request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/queuebuzz_internal_modules_auth_dto.RegisterRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Magic link sent. Check your email.
          schema:
            $ref: '#/definitions/helpers.SuccessResponse'
        "400":
          description: Invalid request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Register a Host
      tags:
      - Auth
  /auth/social/{provider}/callback:
    get:
      description: Handles OAuth provider callbacks, creates or links a host account,
        sets auth cookies, and redirects to the dashboard.
      parameters:
      - description: Social provider
        in: path
        name: provider
        required: true
        type: string
      - description: OAuth code
        in: query
        name: code
        type: string
      - description: OAuth state
        in: query
        name: state
        type: string
      produces:
      - text/html
      responses:
        "302":
          description: Redirect to dashboard
          schema:
            type: string
        "400":
          description: Error response
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Error response
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Error response
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Complete social sign in
      tags:
      - Auth
  /auth/social/{provider}/start:
    get:
      description: Starts the provider OAuth authorization code flow and redirects
        the browser to the selected provider.
      parameters:
      - description: Social provider
        in: path
        name: provider
        required: true
        type: string
      produces:
      - text/html
      responses:
        "302":
          description: Redirect to provider
          schema:
            type: string
        "400":
          description: Error response
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Error response
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Start social sign in
      tags:
      - Auth
  /auth/verify:
    get:
      description: Verifies a magic link or OTP, creates or links a host account,
        sets auth cookies, and redirects to the dashboard.
      parameters:
      - description: Magic link token
        in: query
        name: token
        type: string
      - description: Phone number
        in: query
        name: phone
        type: string
      - description: OTP code
        in: query
        name: otp
        type: string
      produces:
      - text/html
      responses:
        "302":
          description: Redirect to dashboard
          schema:
            type: string
        "400":
          description: Error response
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Error response
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Error response
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Verify magic link or OTP
      tags:
      - Auth
  /host/me:
    get:
      description: Gets the authenticated host profile.
      parameters:
      - description: Phone number
        in: query
        name: phone
        type: string
      - description: OTP code
        in: query
        name: otp
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Host profile
          schema:
            additionalProperties: true
            type: object
        "302":
          description: Found
          schema:
            allOf:
            - $ref: '#/definitions/helpers.SuccessResponse'
            - properties:
                Data:
                  $ref: '#/definitions/dto.GetMeResponse'
              type: object
        "400":
          description: Error response
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Error response
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Error response
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get authenticated host
      tags:
      - Host
  /queue/{id}/add-entry:
    post:
      description: Adds a new entry to the live queue for the authenticated host.
      parameters:
      - description: Queue ID
        in: path
        name: id
        required: true
        type: string
      - description: Add entry request
        in: body
        name: name
        required: true
        schema:
          $ref: '#/definitions/dto.AddEntryRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Entry added
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Error response
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Error response
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Error response
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Add a new entry to the queue
      tags:
      - Queue
  /queue/{id}/close:
    post:
      description: Closes the live queue for the authenticated host.
      parameters:
      - description: Queue ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Queue closed
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Error response
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Error response
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Error response
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Close a queue
      tags:
      - Queue
  /queue/{id}/events:
    get:
      description: Gets the live queue events for the authenticated host.
      produces:
      - application/json
      responses:
        "200":
          description: Live queue events
          schema:
            additionalProperties: true
            type: object
        "302":
          description: Found
          schema:
            allOf:
            - $ref: '#/definitions/helpers.SuccessResponse'
            - properties:
                Data:
                  $ref: '#/definitions/dto.GetLiveQueueResponse'
              type: object
        "400":
          description: Error response
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Error response
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Error response
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get live queue events
      tags:
      - Queue
  /queue/{id}/live:
    get:
      description: Gets the live queue for the authenticated host.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/helpers.SuccessResponse'
            - properties:
                Data:
                  $ref: '#/definitions/dto.GetLiveQueueResponse'
              type: object
        "400":
          description: Error response
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Error response
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Error response
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get live queue by ID
      tags:
      - Queue
  /queue/{id}/pause:
    post:
      description: Pauses the live queue for the authenticated host.
      parameters:
      - description: Queue ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Queue paused
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Error response
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Error response
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Error response
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Pause a queue
      tags:
      - Queue
  /queue/{id}/resume:
    post:
      description: Resumes the live queue for the authenticated host.
      parameters:
      - description: Queue ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Queue resumed
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Error response
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Error response
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Error response
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Resume a queue
      tags:
      - Queue
  /queue/create:
    post:
      description: Creates a new queue for BOTH authenticated and anonymous host.
      parameters:
      - description: Create queue request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateQueueRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Queue created
          schema:
            additionalProperties: true
            type: object
        "302":
          description: Found
          schema:
            allOf:
            - $ref: '#/definitions/helpers.SuccessResponse'
            - properties:
                Data:
                  $ref: '#/definitions/dto.CreateQueueResponse'
              type: object
        "400":
          description: Error response
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Error response
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Error response
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create a new queue
      tags:
      - Queue
  /queue/live:
    get:
      description: Gets the live queue for the authenticated host.
      produces:
      - application/json
      responses:
        "200":
          description: Live queue
          schema:
            additionalProperties: true
            type: object
        "302":
          description: Found
          schema:
            allOf:
            - $ref: '#/definitions/helpers.SuccessResponse'
            - properties:
                Data:
                  $ref: '#/definitions/dto.GetLiveQueueResponse'
              type: object
        "400":
          description: Error response
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Error response
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Error response
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get live queue
      tags:
      - Queue
  /queue/slug-check:
    get:
      description: Checks whether a queue slug is unique and available.
      parameters:
      - description: Slug to check
        in: query
        name: slug
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/helpers.SuccessResponse'
            - properties:
                Data:
                  $ref: '#/definitions/dto.CheckSlugResponse'
              type: object
        "400":
          description: Error response
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Error response
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Check if a slug is available
      tags:
      - Queue
securityDefinitions:
  BearerAuth:
    description: 'RS256 JWT — format: Bearer {token}'
    in: header
    name: Authorization
    type: apiKey
  UserToken:
    description: UUID user session token
    in: header
    name: X-User-Token
    type: apiKey
swagger: "2.0"
