basePath: /api
definitions:
  dto.GetMeResponse:
    properties:
      avatar:
        type: string
      email:
        type: string
      id:
        type: string
      name:
        type: string
      public_id:
        type: string
      tier:
        type: string
    type: object
  helpers.SuccessResponse:
    properties:
      data: {}
      message:
        type: string
    type: object
  queuebuzz_internal_modules_auth_dto.RegisterRequest:
    properties:
      email:
        type: string
      phone:
        type: string
    type: object
host: localhost:8080
info:
  contact:
    email: support@queuebuzz.com
    name: QueueBuzz Support
  description: Virtual queue management platform API.
  license:
    name: Proprietary
  termsOfService: https://queuebuzz.com/terms
  title: QueueBuzz API
  version: "1.0"
paths:
  /api/v1/auth/logout:
    post:
      description: Clears host auth cookies and revokes the refresh token if present
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/helpers.SuccessResponse'
      summary: Logout host
      tags:
      - Host
  /api/v1/auth/refresh:
    post:
      description: Uses the refresh token cookie to issue a new access token and refresh
        token
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/helpers.SuccessResponse'
        "401":
          description: Error response
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Refresh access token
      tags:
      - Host
  /api/v1/auth/register:
    post:
      consumes:
      - application/json
      description: Triggers Magic Link (email) or OTP (phone) for host registration
      parameters:
      - description: Register host request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/queuebuzz_internal_modules_auth_dto.RegisterRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Magic link sent. Check your email.
          schema:
            $ref: '#/definitions/helpers.SuccessResponse'
        "400":
          description: Invalid request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Register a Host
      tags:
      - Host
  /auth/social/{provider}/callback:
    get:
      description: Handles OAuth provider callbacks, creates or links a host account,
        sets auth cookies, and redirects to the dashboard.
      parameters:
      - description: Social provider
        in: path
        name: provider
        required: true
        type: string
      - description: OAuth code
        in: query
        name: code
        type: string
      - description: OAuth state
        in: query
        name: state
        type: string
      produces:
      - text/html
      responses:
        "302":
          description: Redirect to dashboard
          schema:
            type: string
        "400":
          description: Error response
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Error response
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Error response
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Complete social sign in
      tags:
      - Host
  /auth/social/{provider}/start:
    get:
      description: Starts the provider OAuth authorization code flow and redirects
        the browser to the selected provider.
      parameters:
      - description: Social provider
        in: path
        name: provider
        required: true
        type: string
      produces:
      - text/html
      responses:
        "302":
          description: Redirect to provider
          schema:
            type: string
        "400":
          description: Error response
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Error response
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Start social sign in
      tags:
      - Host
  /auth/verify:
    get:
      description: Gets the authenticated host profile.
      parameters:
      - description: Phone number
        in: query
        name: phone
        type: string
      - description: OTP code
        in: query
        name: otp
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Host profile
          schema:
            additionalProperties: true
            type: object
        "302":
          description: Found
          schema:
            allOf:
            - $ref: '#/definitions/helpers.SuccessResponse'
            - properties:
                Data:
                  $ref: '#/definitions/dto.GetMeResponse'
              type: object
        "400":
          description: Error response
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Error response
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Error response
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get authenticated host
      tags:
      - Host
securityDefinitions:
  BearerAuth:
    description: 'RS256 JWT — format: Bearer {token}'
    in: header
    name: Authorization
    type: apiKey
  UserToken:
    description: UUID user session token
    in: header
    name: X-User-Token
    type: apiKey
swagger: "2.0"
