basePath: /api
definitions:
  dto.ActiveQueueStats:
    properties:
      isActive:
        type: boolean
      queueName:
        type: string
      startedAt:
        type: string
    type: object
  dto.AddEntryRequest:
    properties:
      email:
        type: string
      name:
        maxLength: 50
        minLength: 3
        type: string
      party_size:
        maximum: 100
        minimum: 1
        type: integer
      phone:
        type: string
    required:
    - name
    type: object
  dto.ChartDataPoint:
    properties:
      avgWait:
        description: in seconds
        type: integer
      day:
        type: string
      isFuture:
        type: boolean
      isToday:
        type: boolean
      value:
        type: integer
    type: object
  dto.CheckMethodRequest:
    properties:
      claim_queue_id:
        type: string
      email:
        type: string
    required:
    - email
    type: object
  dto.CheckSlugResponse:
    properties:
      is_available:
        type: boolean
    type: object
  dto.CreateQueueRequest:
    properties:
      allow_party_joining:
        type: boolean
      avg_service_mins:
        maximum: 60
        minimum: 1
        type: integer
      collect_emails:
        type: boolean
      max_party_size:
        maximum: 100
        minimum: 1
        type: integer
      name:
        maxLength: 50
        minLength: 3
        type: string
      recovery_email:
        type: string
      slug:
        maxLength: 20
        minLength: 3
        type: string
    required:
    - name
    type: object
  dto.DashboardData:
    properties:
      activeQueue:
        $ref: '#/definitions/dto.ActiveQueueStats'
      droppedSkipped:
        items:
          $ref: '#/definitions/dto.HeatmapPoint'
        type: array
      greeting:
        $ref: '#/definitions/dto.GreetingData'
      peakHours:
        items:
          $ref: '#/definitions/dto.PeakHourPoint'
        type: array
      quickSetup:
        $ref: '#/definitions/dto.QuickSetupData'
      recentSessions:
        items:
          $ref: '#/definitions/dto.RecentSession'
        type: array
      returnRate:
        $ref: '#/definitions/dto.ReturnRateStats'
      stats:
        $ref: '#/definitions/dto.DashboardStats'
      weekChart:
        items:
          $ref: '#/definitions/dto.ChartDataPoint'
        type: array
    type: object
  dto.DashboardStats:
    properties:
      avgWait:
        type: string
      peakWait:
        type: integer
      servedToday:
        type: integer
      skipped:
        type: integer
    type: object
  dto.EntryRecord:
    properties:
      created_at:
        type: string
      created_by:
        type: string
      email:
        type: string
      finished_at:
        type: string
      id:
        type: string
      name:
        type: string
      party_size:
        type: integer
      phone:
        type: string
      position:
        type: integer
      queue_id:
        type: string
      served_at:
        type: string
      status:
        type: string
      ticket_no:
        type: string
      updated_at:
        type: string
      wait_time_min:
        type: integer
    type: object
  dto.GetMeResponse:
    properties:
      avatar:
        type: string
      banner_image_url:
        type: string
      email:
        type: string
      id:
        type: string
      name:
        type: string
      profile_image_url:
        type: string
      public_id:
        type: string
      tier:
        type: string
    type: object
  dto.GreetingData:
    properties:
      name:
        type: string
    type: object
  dto.HeatmapPoint:
    properties:
      day:
        type: integer
      hour:
        type: integer
      value:
        type: integer
    type: object
  dto.PeakHourPoint:
    properties:
      hour:
        type: string
      value:
        type: integer
    type: object
  dto.QueueRecord:
    properties:
      allow_party_joining:
        type: boolean
      avg_service_mins:
        type: integer
      collect_emails:
        type: boolean
      created_at:
        type: string
      expires_at:
        type: string
      host_banner_image_url:
        type: string
      host_profile_image_url:
        type: string
      id:
        type: string
      join_code:
        type: string
      max_party_size:
        type: integer
      name:
        type: string
      notes:
        type: string
      recovery_email:
        type: string
      slug:
        type: string
      status:
        type: string
      strict_queue_mode:
        type: boolean
      updated_at:
        type: string
    type: object
  dto.QuickSetupData:
    properties:
      show:
        type: boolean
      steps:
        items:
          $ref: '#/definitions/dto.QuickSetupStep'
        type: array
    type: object
  dto.QuickSetupStep:
    properties:
      isDone:
        type: boolean
      label:
        type: string
      sub:
        type: string
    type: object
  dto.RecentSession:
    properties:
      date:
        type: string
      duration:
        type: string
      id:
        type: string
      name:
        type: string
      served:
        type: integer
    type: object
  dto.ReturnRatePoint:
    properties:
      day:
        type: string
      rate:
        type: number
    type: object
  dto.ReturnRateQueue:
    properties:
      label:
        type: string
      rate:
        type: number
    type: object
  dto.ReturnRateStats:
    properties:
      byQueue:
        items:
          $ref: '#/definitions/dto.ReturnRateQueue'
        type: array
      chartData:
        items:
          $ref: '#/definitions/dto.ReturnRatePoint'
        type: array
      hasData:
        type: boolean
      returningCount:
        type: integer
    type: object
  dto.UpdateEntryRequest:
    properties:
      email:
        type: string
      fcm_token:
        type: string
      name:
        minLength: 2
        type: string
      party_size:
        maximum: 100
        minimum: 1
        type: integer
    type: object
  dto.UpdateQueueRequest:
    properties:
      allow_party_joining:
        type: boolean
      avg_service_mins:
        maximum: 60
        minimum: 1
        type: integer
      collect_emails:
        type: boolean
      max_party_size:
        maximum: 100
        minimum: 1
        type: integer
      name:
        maxLength: 50
        minLength: 3
        type: string
      notes:
        maxLength: 5000
        type: string
      recovery_email:
        type: string
      slug:
        maxLength: 20
        minLength: 3
        type: string
      strict_queue_mode:
        type: boolean
    type: object
  helpers.SuccessResponse:
    properties:
      data: {}
      message:
        type: string
    type: object
  sse.Message:
    properties:
      data: {}
      event:
        type: string
    type: object
host: localhost:8080
info:
  contact:
    email: support@queuebuzz.com
    name: QueueBuzz Support
  description: Virtual queue management platform API.
  license:
    name: Proprietary
  termsOfService: https://queuebuzz.com/terms
  title: QueueBuzz API
  version: "1.0"
paths:
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: Handles authentication entry point. If the email is social-linked,
        redirects to provider. If not, sends a magic link.
      parameters:
      - description: Authentication request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CheckMethodRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Magic link sent
          schema:
            $ref: '#/definitions/helpers.SuccessResponse'
        "302":
          description: Redirect to social provider
          schema:
            type: string
        "400":
          description: Invalid request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Login or Register via email
      tags:
      - Auth
  /api/v1/auth/logout:
    post:
      description: Clears host auth cookies and revokes the refresh token if present
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/helpers.SuccessResponse'
      summary: Logout host
      tags:
      - Auth
  /api/v1/auth/refresh:
    post:
      description: Uses the refresh token cookie to issue a new access token and refresh
        token
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/helpers.SuccessResponse'
        "401":
          description: Error response
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Refresh access token
      tags:
      - Auth
  /auth/social/{provider}/callback:
    get:
      description: Handles OAuth provider callbacks, creates or links a host account,
        sets auth cookies, and redirects to the dashboard.
      parameters:
      - description: Social provider
        in: path
        name: provider
        required: true
        type: string
      - description: OAuth code
        in: query
        name: code
        type: string
      - description: OAuth state
        in: query
        name: state
        type: string
      produces:
      - text/html
      responses:
        "302":
          description: Redirect to dashboard
          schema:
            type: string
        "400":
          description: Error response
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Error response
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Error response
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Complete social sign in
      tags:
      - Auth
  /auth/social/{provider}/start:
    get:
      description: Starts the provider OAuth authorization code flow and redirects
        the browser to the selected provider.
      parameters:
      - description: Social provider
        in: path
        name: provider
        required: true
        type: string
      produces:
      - text/html
      responses:
        "302":
          description: Redirect to provider
          schema:
            type: string
        "400":
          description: Error response
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Error response
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Start social sign in
      tags:
      - Auth
  /auth/verify:
    get:
      description: Verifies a magic link or OTP, creates or links a host account,
        sets auth cookies, and redirects to the dashboard.
      parameters:
      - description: Magic link token
        in: query
        name: token
        type: string
      - description: Phone number
        in: query
        name: phone
        type: string
      - description: OTP code
        in: query
        name: otp
        type: string
      produces:
      - text/html
      responses:
        "302":
          description: Redirect to dashboard
          schema:
            type: string
        "400":
          description: Error response
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Error response
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Error response
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Verify magic link or OTP
      tags:
      - Auth
  /entry/{id}:
    get:
      description: Gets an entry by ID for the authenticated host.
      produces:
      - application/json
      responses:
        "200":
          description: Entry added
          schema:
            $ref: '#/definitions/dto.EntryRecord'
        "400":
          description: Error response
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Error response
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Error response
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get entry by ID
      tags:
      - Entry
  /entry/{id}/stream:
    get:
      description: Streams events for an entry.
      produces:
      - application/json
      responses:
        "200":
          description: Entry added
          schema:
            $ref: '#/definitions/dto.EntryRecord'
        "400":
          description: Error response
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Error response
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Error response
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Stream events for an entry
      tags:
      - Entry
  /entry/confirm:
    post:
      description: Transition from IDLE back to WAITING status when customer confirms
        presence.
      produces:
      - application/json
      responses:
        "200":
          description: Success
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Error response
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Error response
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Confirm still here (Recovery)
      tags:
      - Entry
  /entry/confirm-arrived:
    post:
      description: Confirms arrival for the currently authenticated entry.
      produces:
      - application/json
      responses:
        "200":
          description: Successfully confirmed arrival
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Error response
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Error response
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Error response
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Confirm arrived
      tags:
      - Entry
  /entry/finish:
    post:
      description: Marks the currently authenticated entry as served and clears the
        session.
      produces:
      - application/json
      responses:
        "200":
          description: Successfully finished service
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Error response
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Error response
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Finish service (Guest self-serve)
      tags:
      - Entry
  /entry/join-by-code/{code}:
    get:
      description: Joins the queue using a 6-character code.
      produces:
      - application/json
      responses:
        "200":
          description: Successfully joined the queue
          schema:
            $ref: '#/definitions/dto.EntryRecord'
        "400":
          description: Error response
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Error response
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Error response
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Join queue by code
      tags:
      - Entry
  /entry/join/{id}:
    post:
      description: Joins the queue using a queue ID.
      produces:
      - application/json
      responses:
        "200":
          description: Successfully joined the queue
          schema:
            $ref: '#/definitions/dto.EntryRecord'
        "400":
          description: Error response
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Error response
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Error response
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Join queue by ID
      tags:
      - Entry
  /entry/recover-session:
    get:
      description: Recovers the session for the currently authenticated entry.
      produces:
      - application/json
      responses:
        "200":
          description: Session recovered
          schema:
            $ref: '#/definitions/dto.EntryRecord'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Recover session
      tags:
      - Entry
  /entry/update:
    post:
      description: Updates the name, email, or party size for the currently authenticated
        entry.
      parameters:
      - description: Update entry request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateEntryRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Success message
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Update entry details
      tags:
      - Entry
  /host/me:
    get:
      description: Gets the authenticated host profile.
      parameters:
      - description: Phone number
        in: query
        name: phone
        type: string
      - description: OTP code
        in: query
        name: otp
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Host profile
          schema:
            additionalProperties: true
            type: object
        "302":
          description: Found
          schema:
            allOf:
            - $ref: '#/definitions/helpers.SuccessResponse'
            - properties:
                Data:
                  $ref: '#/definitions/dto.GetMeResponse'
              type: object
        "400":
          description: Error response
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Error response
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Error response
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get authenticated host
      tags:
      - Host
  /queue/{id}:
    patch:
      description: Updates the queue settings for the host (name, avg service mins,
        recovery email).
      parameters:
      - description: Queue ID
        in: path
        name: id
        required: true
        type: string
      - description: Update queue request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateQueueRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Queue updated
          schema:
            allOf:
            - $ref: '#/definitions/helpers.SuccessResponse'
            - properties:
                Data:
                  type: object
              type: object
        "400":
          description: Error response
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Error response
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Error response
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Update queue settings
      tags:
      - Queue
  /queue/{id}/add-entry:
    post:
      description: Adds a new entry to the live queue for the authenticated host.
      parameters:
      - description: Queue ID
        in: path
        name: id
        required: true
        type: string
      - description: Add entry request
        in: body
        name: name
        required: true
        schema:
          $ref: '#/definitions/dto.AddEntryRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Entry added
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Error response
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Error response
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Error response
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Add a new entry to the queue
      tags:
      - Queue
  /queue/{id}/call/{entry_id}:
    post:
      description: Calls a new entry to the live queue for the authenticated host.
      parameters:
      - description: Queue ID
        in: path
        name: id
        required: true
        type: string
      - description: Entry ID
        in: path
        name: entry_id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Entry called
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Error response
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Error response
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Error response
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Call a new entry to the queue
      tags:
      - Queue
  /queue/{id}/close:
    post:
      description: Closes the live queue for the authenticated host.
      parameters:
      - description: Queue ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Queue closed
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Error response
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Error response
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Error response
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Close a queue
      tags:
      - Queue
  /queue/{id}/events:
    get:
      description: Gets the live queue events for the authenticated host.
      produces:
      - text/event-stream
      responses:
        "200":
          description: Stream of live queue events
          headers:
            Cache-Control:
              description: no-cache
              type: string
            Connection:
              description: keep-alive
              type: string
            Content-Type:
              description: text/event-stream
              type: string
          schema:
            $ref: '#/definitions/sse.Message'
        "400":
          description: Error response
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Error response
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Error response
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get live queue events
      tags:
      - Queue
  /queue/{id}/events/public:
    get:
      description: Gets the public queue events for the authenticated host.
      produces:
      - text/event-stream
      responses:
        "200":
          description: Stream of public queue events
          headers:
            Cache-Control:
              description: no-cache
              type: string
            Connection:
              description: keep-alive
              type: string
            Content-Type:
              description: text/event-stream
              type: string
          schema:
            $ref: '#/definitions/sse.Message'
        "400":
          description: Error response
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Error response
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Error response
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get public queue events
      tags:
      - Queue
  /queue/{id}/live:
    get:
      description: Gets the live queue for the authenticated host.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/helpers.SuccessResponse'
            - properties:
                Data:
                  $ref: '#/definitions/dto.QueueRecord'
              type: object
        "400":
          description: Error response
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Error response
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Error response
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get live queue by ID
      tags:
      - Queue
  /queue/{id}/pause:
    post:
      description: Pauses the live queue for the authenticated host.
      parameters:
      - description: Queue ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Queue paused
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Error response
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
