# fly.toml app configuration file generated for queuebuzz

app = "queuebuzz"
primary_region = "bom"

kill_signal = "SIGINT"
kill_timeout = "25s"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "5s"
    interval = "15s"
    method = "get"
    path = "/healthz"
    protocol = "http"
    timeout = "2s"

[env]
  APP_ENV="production"
  APP_PORT="8080"
  APP_URL="https://api.queuebuzz.com"
  FRONTEND_URL="https://queuebuzz.com"
  AUTH_CALLBACK_URL="https://queuebuzz.com/dashboard"
  EMAIL_FROM="noreply@queuebuzz.com"
  ALLOWED_ORIGIN="https://queuebuzz.com,https://accounts.google.com,https://storage.queuebuzz.com,https://checkout.dodopayments.com"

