# lefthook.yml
# Best practices: parallel runs, globbed file checks, and auto-tidying.

pre-commit:
  parallel: true
  commands:
    # 1. Clean dependencies (vital for Go repos)
    tidy:
      run: go mod tidy && git add go.mod go.sum

    # 2. Comprehensive linting (applies --fix automatically)
    lint:
      glob: "*.go"
      run: golangci-lint run --fix && git add {staged_files}

pre-push:
  commands:
    # Unit + integration tests with race detector and coverage (excludes e2e which needs Docker)
    test-coverage:
      run: >-
        go test -v -race
        -coverpkg=./internal/...
        -coverprofile=coverage.out
        -covermode=atomic
        $(go list ./... | grep -v 'tests/e2e')
