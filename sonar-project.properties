
sonar.projectKey=queueBuzz-server
sonar.projectName=QueueBuzz Server
sonar.projectVersion=1.0

# Server Connection
sonar.host.url=http://localhost:9000

# Encoding
sonar.sourceEncoding=UTF-8

# Path to source directories
sonar.sources=./internal,./tests
sonar.exclusions=**/vendor/**,**/.scannerwork/**,**/tmp/**,**/*.md,**/*.yml,**/*.yaml,Dockerfile,Makefile,docker-compose.yml

# Go Specifics
sonar.go.gogit.reportPaths=coverage.out
sonar.go.exclusions=**/vendor/**

# Exclude Annoying Rules (matching frontend pattern)
sonar.issue.ignore.multicriteria=e1,e2
# S1135: TODO tags
sonar.issue.ignore.multicriteria.e1.ruleKey=go:S1135
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*
# S125: Commented out code
sonar.issue.ignore.multicriteria.e2.ruleKey=go:S125
sonar.issue.ignore.multicriteria.e2.resourceKey=**/*
